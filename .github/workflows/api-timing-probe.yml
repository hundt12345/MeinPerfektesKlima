name: API-Timing (Diagnose)

# Kleines Diagnose-Werkzeug: misst, wie lange Open-Meteo-Anfragen verschiedener
# Größe auf dem Runner brauchen, und committet das Ergebnis als data/api-timing.txt.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/api-timing-probe.yml"

permissions:
  contents: write

jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Messung
        run: |
          set -o pipefail
          mkdir -p data
          python - <<'PY' 2>&1 | tee data/api-timing.txt
          import json, time, urllib.parse, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          API = "https://archive-api.open-meteo.com/v1/archive"
          VARS = ["temperature_2m_max","temperature_2m_min","dew_point_2m_mean","sunshine_duration","precipitation_sum"]
          # Punkte über Europa (grob über Land)
          pts = [(52.5-i*0.75, 13.5+j*0.75) for i in range(20) for j in range(20)][:400]

          def call(n, start, end):
              lat = ",".join(f"{p[0]:.3f}" for p in pts[:n])
              lon = ",".join(f"{p[1]:.3f}" for p in pts[:n])
              url = f"{API}?{urllib.parse.urlencode({'latitude':lat,'longitude':lon,'start_date':start,'end_date':end,'daily':','.join(VARS),'timezone':'UTC','models':'era5'})}"
              t0 = time.time()
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent":"timing-probe"}), timeout=300) as r:
                      raw = r.read()
                  d = json.loads(raw)
                  nloc = len(d) if isinstance(d, list) else 1
                  return round(time.time()-t0, 1), round(len(raw)/1e6, 2), nloc, None
              except Exception as exc:
                  return round(time.time()-t0, 1), 0, 0, f"{type(exc).__name__}: {exc}"

          print("== Einzelanfragen ==", flush=True)
          for n, start, end in [(5, "2023-01-01", "2023-12-31"),
                                (20, "2023-01-01", "2023-12-31"),
                                (20, "2016-01-01", "2020-12-31"),
                                (25, "2016-01-01", "2025-12-31")]:
              dt, mb, nloc, err = call(n, start, end)
              days = (int(end[:4])-int(start[:4]))*365 + 365
              print(f"  {n:3d} Punkte  {start}..{end}  -> {dt:6.1f} s  {mb:5.2f} MB  {nloc:3d} Orte "
                    f"({n*days:6d} Punkt-Tage, {dt/(n*days)*1e6:.0f} µs/Punkt-Tag)  {err or ''}", flush=True)

          print("== Parallelität (gleiche Anfrage, 1 vs 6 Threads) ==", flush=True)
          def batch(_):
              return call(20, "2016-01-01", "2020-12-31")
          for threads in (1, 6):
              t0 = time.time()
              with ThreadPoolExecutor(max_workers=threads) as pool:
                  res = list(pool.map(batch, range(6)))
              print(f"  6 Anfragen x 20 Punkte x 5 Jahre mit {threads} Threads: {time.time()-t0:.1f} s "
                    f"(Einzelzeiten {[r[0] for r in res]}, Fehler {[r[3] for r in res if r[3]]})", flush=True)
          print("ENDE", flush=True)
          PY

      - name: Ergebnis committen
        if: always()
        run: |
          git config user.name "klima-datenbot"
          git config user.email "klima-datenbot@users.noreply.github.com"
          git add -f data/api-timing.txt || true
          git diff --cached --quiet || { git commit -m "Diagnose: API-Timing [skip ci]" && git push; }
