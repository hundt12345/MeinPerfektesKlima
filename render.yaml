# Render-Blueprint: https://render.com/docs/blueprint-spec
# Nach dem Verbinden des Repos legt Render daraus automatisch den Web-Service an.
services:
  - type: web
    name: mein-perfektes-klima
    runtime: python
    plan: starter          # free geht auch, braucht aber mehr RAM beim Rendern der Karte
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: MALLOC_ARENA_MAX
        value: "2"
